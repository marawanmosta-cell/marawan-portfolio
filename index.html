              srcset="assets/al-forsan/plot-14-courtyard-preview.webp?v=sharp 480w, assets/al-forsan/plot-14-courtyard-wide.webp?v=sharp 900w, assets/al-forsan/plot-14-courtyard.webp?v=sharp 1080w"
              sizes="calc((100vw - 36px) / 2)">
            <img src="assets/al-forsan/plot-14-courtyard-wide.webp?v=sharp" srcset="assets/al-forsan/plot-14-courtyard-wide.webp?v=sharp 900w, assets/al-forsan/plot-14-courtyard.webp?v=sharp 1080w" sizes="32vw"
              data-full="assets/al-forsan/plot-14-courtyard.webp?v=sharp" width="1080" height="1440" alt="A landscaped retail courtyard with glass façades under a blue sky" decoding="async" loading="lazy">
          </picture>
          <span class="poster-caption"><span class="poster-title">Plot 14 — On the Axis</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
      </div>
    </section>

  </main>

  <template id="arrangement-controls">
    <div class="arrangement-controls">
      <div class="arrangement-toolbar">
        <p>Drag an artwork onto another to swap them, or select them in turn.</p>
        <div class="arrangement-actions">
          <button type="button" class="add-artwork">Add images</button>
          <button type="button" class="copy-order">Copy changes for GitHub</button>
          <a href="https://github.com/marawanmosta-cell/marawan-portfolio/edit/main/artwork-order.js" target="_blank" rel="noopener">Open order file ↗</a>
        </div>
      </div>
      <details class="gallery-trash">
        <summary>Trash <span class="trash-count">(0)</span></summary>
        <p class="trash-empty">Trash is empty.</p>
        <ul class="trash-list" hidden></ul>
      </details>
      <p class="arrangement-status" role="status"></p>
      <textarea class="arrangement-copy" aria-label="Order to paste into GitHub" readonly hidden></textarea>
    </div>
  </template>

  <dialog class="editor-dialog" aria-labelledby="editor-title">
    <form class="editor-form">
      <h2 id="editor-title"></h2>
      <label class="editor-name">Name <input name="name" type="text" maxlength="90"></label>
      <label class="editor-file">
        <span class="editor-file-label">Images</span>
        <input name="files" type="file" accept="image/jpeg,image/png,image/webp">
        <small>Gallery previews fill a 3:4 frame. Open the image in the portfolio to see its full composition.</small>
      </label>
      <label class="editor-alt">Image description <input name="alt" type="text" maxlength="180"></label>
      <p class="editor-message" role="status"></p>
      <div class="editor-dialog-actions">
        <button type="button" class="editor-cancel">Cancel</button>
        <button type="submit" class="editor-save">Save draft</button>
      </div>
    </form>
  </dialog>

  <dialog class="viewer" aria-label="Project artwork">
    <div class="viewer-bar">
      <span class="viewer-position" aria-live="polite"></span>
      <div class="viewer-actions">
        <button type="button" data-step="-1" aria-label="Previous artwork">←</button>
        <button type="button" data-step="1" aria-label="Next artwork">→</button>
        <form method="dialog"><button type="submit" aria-label="Close artwork" autofocus>✕</button></form>
      </div>
    </div>
    <figure>
      <img class="viewer-image" alt="">
      <figcaption class="viewer-caption"></figcaption>
    </figure>
  </dialog>
</body>
</html>
