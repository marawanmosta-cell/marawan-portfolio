<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected design projects by Marawan.">
  <meta name="theme-color" content="#121212">
  <title>Marawan — Selected Work</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <span class="wordmark">MARAWAN</span>
    <nav class="project-index" aria-label="Projects">
      <div class="project-tabs" role="tablist" aria-label="Selected work">
        <button type="button" role="tab" id="forsan-tab" aria-controls="forsan-gallery" aria-selected="true">AL FORSAN</button>
        <button type="button" role="tab" id="segments-tab" aria-controls="segments-gallery" aria-selected="false" tabindex="-1">Segments</button>
      </div>
    </nav>
  </header>

  <main id="work" class="project-stack">
    <section class="project" id="forsan-gallery" role="tabpanel" aria-labelledby="forsan-tab" tabindex="0">
      <div class="project-header">
        <h1>AL FORSAN</h1>
        <span class="project-meta">9 artworks</span>
      </div>
      <div class="image-grid">
        <button type="button" class="poster" aria-label="View New Form, Same Force">
          <span class="poster-image">
            <img src="assets/al-forsan/new-form-preview.webp" srcset="assets/al-forsan/new-form-preview.webp 400w, assets/al-forsan/new-form-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/new-form.webp" width="1080" height="1440" alt="Red-lit close-up of a horse’s eye with the Forsan Developments wordmark" decoding="async" fetchpriority="high">
          </span>
          <span class="poster-caption"><span class="poster-title">New Form, Same Force</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Zero-Risk Execution">
          <span class="poster-image">
            <img src="assets/al-forsan/zero-risk-preview.webp" srcset="assets/al-forsan/zero-risk-preview.webp 400w, assets/al-forsan/zero-risk-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/zero-risk.webp" width="1080" height="1440" alt="A hand holding a horse-head cane beside a red hard hat" decoding="async">
          </span>
          <span class="poster-caption"><span class="poster-title">Zero-Risk Execution</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Field Mastery">
          <span class="poster-image">
            <img src="assets/al-forsan/field-mastery-preview.webp" srcset="assets/al-forsan/field-mastery-preview.webp 400w, assets/al-forsan/field-mastery-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/field-mastery.webp" width="1080" height="1440" alt="People casting long shadows across a grid above a red block of typography" decoding="async">
          </span>
          <span class="poster-caption"><span class="poster-title">Field Mastery</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Endless Connection">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-architecture-preview.webp" srcset="assets/al-forsan/laguna-architecture-preview.webp 400w, assets/al-forsan/laguna-architecture-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-architecture.webp" width="1080" height="1440" alt="Lit windows in a curved Laguna Mall facade with red light trails" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Endless Connection</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Sheikh Zaid">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-cafe-preview.webp" srcset="assets/al-forsan/laguna-cafe-preview.webp 400w, assets/al-forsan/laguna-cafe-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-cafe.webp" width="1080" height="1440" alt="A person holding a cup in a café framed by soft red reflections" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Sheikh Zaid</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Flow and Discovery">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-stairs-preview.webp" srcset="assets/al-forsan/laguna-stairs-preview.webp 400w, assets/al-forsan/laguna-stairs-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-stairs.webp" width="1080" height="1440" alt="Blurred shoppers in motion on a vivid red staircase" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Flow and Discovery</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Service Meets Lifestyle">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-lifestyle-preview.webp" srcset="assets/al-forsan/laguna-lifestyle-preview.webp 400w, assets/al-forsan/laguna-lifestyle-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-lifestyle.webp" width="1080" height="1440" alt="A woman in red sitting in a shopping cart in a dark car park" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Service Meets Lifestyle</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Plot 14, The Arena of Dominance">
          <span class="poster-image">
            <img src="assets/al-forsan/plot-14-arena-preview.webp" srcset="assets/al-forsan/plot-14-arena-preview.webp 400w, assets/al-forsan/plot-14-arena-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/plot-14-arena.webp" width="1080" height="1440" alt="A silhouetted figure on a stairway beside a sweeping red wall" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Plot 14 — The Arena of Dominance</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Plot 14, On the Axis">
          <span class="poster-image">
            <img src="assets/al-forsan/plot-14-courtyard-preview.webp" srcset="assets/al-forsan/plot-14-courtyard-preview.webp 400w, assets/al-forsan/plot-14-courtyard-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/plot-14-courtyard.webp" width="1080" height="1440" alt="A landscaped retail courtyard with glass façades under a blue sky" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Plot 14 — On the Axis</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
      </div>
    </section>

    <section class="project" id="segments-gallery" role="tabpanel" aria-labelledby="segments-tab" tabindex="0" hidden>
      <div class="project-header">
        <h1>Segments</h1>
      </div>
      <p class="empty-gallery">Artwork coming soon.</p>
    </section>
  </main>

  <dialog class="viewer" aria-label="Project artwork">
    <div class="viewer-bar">
      <span class="viewer-position" aria-live="polite"></span>
      <div class="viewer-actions">
        <button type="button" data-step="-1" aria-label="Previous artwork">←</button>
        <button type="button" data-step="1" aria-label="Next artwork">→</button>
        <form method="dialog"><button type="submit" aria-label="Close artwork" autofocus>✕</button></form>
      </div>
    </div>
    <figure>
      <img class="viewer-image" alt="">
      <figcaption class="viewer-caption"></figcaption>
    </figure>
  </dialog>
</body>
</html>
