<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected design projects by Marawan.">
  <meta name="theme-color" content="#121212">
  <title>Marawan — Selected Work</title>
  <link rel="stylesheet" href="styles.css?v=perla">
  <script src="script.js?v=perla" defer></script>
</head>
<body>
  <header class="site-header">
    <span class="wordmark">MARAWAN</span>
    <nav class="project-index" aria-label="Projects">
      <div class="project-tabs" role="tablist" aria-label="Selected work">
        <button type="button" role="tab" id="perla-tab" aria-controls="perla-project" aria-selected="true">Perla</button>
        <button type="button" role="tab" id="forsan-tab" aria-controls="forsan-gallery" aria-selected="false" tabindex="-1">AL FORSAN</button>
      </div>
    </nav>
  </header>

  <main id="work" class="project-stack">
    <section class="project" id="perla-project" role="tabpanel" aria-labelledby="perla-tab" tabindex="0">
      <div class="project-header">
        <h1>Perla</h1>
      </div>
      <div class="project-tabs collection-tabs" role="tablist" aria-label="Perla collections">
        <button type="button" role="tab" id="properties-tab" aria-controls="properties-gallery" aria-selected="true">Perla Properties</button>
        <button type="button" role="tab" id="gardens-tab" aria-controls="gardens-gallery" aria-selected="false" tabindex="-1">Perla Gardens</button>
      </div>
      <section class="collection" id="properties-gallery" role="tabpanel" aria-labelledby="properties-tab" tabindex="0">
        <div class="image-grid">
          <button type="button" class="poster" aria-label="View Experience Leaves Its Signature">
            <span class="poster-image">
              <img src="assets/perla-properties/beyond-experience-preview.webp" srcset="assets/perla-properties/beyond-experience-preview.webp 400w, assets/perla-properties/beyond-experience-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/beyond-experience.webp" width="1080" height="1440" alt="A suited figure walks past a fan of gold light on a dark stone façade." decoding="async" fetchpriority="high">
            </span>
            <span class="poster-caption"><span class="poster-title">Experience Leaves Its Signature</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Vision Shapes What Comes Next">
            <span class="poster-image">
              <img src="assets/perla-properties/beyond-vision-preview.webp" srcset="assets/perla-properties/beyond-vision-preview.webp 400w, assets/perla-properties/beyond-vision-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/beyond-vision.webp" width="1080" height="1440" alt="A portrait with a fan of amber light across one eye and a strand of pearls." decoding="async">
            </span>
            <span class="poster-caption"><span class="poster-title">Vision Shapes What Comes Next</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Success Demands More — Vision">
            <span class="poster-image">
              <img src="assets/perla-properties/success-vision-preview.webp" srcset="assets/perla-properties/success-vision-preview.webp 400w, assets/perla-properties/success-vision-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/success-vision.webp" width="1080" height="1440" alt="A figure walks across a triangular shaft of sunlight against a concrete wall." decoding="async">
            </span>
            <span class="poster-caption"><span class="poster-title">Success Demands More — Vision</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Success Demands More — Partnership">
            <span class="poster-image">
              <img src="assets/perla-properties/success-partnership-preview.webp" srcset="assets/perla-properties/success-partnership-preview.webp 400w, assets/perla-properties/success-partnership-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/success-partnership.webp" width="1080" height="1440" alt="Two figures cast long shadows on tiled pavement beside orange vertical typography." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Success Demands More — Partnership</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Success Demands More — Commitment">
            <span class="poster-image">
              <img src="assets/perla-properties/success-commitment-preview.webp" srcset="assets/perla-properties/success-commitment-preview.webp 400w, assets/perla-properties/success-commitment-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/success-commitment.webp" width="1080" height="1440" alt="Exposed structural beams against a dark blue sky with orange lettering." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Success Demands More — Commitment</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Success Demands More — Leadership">
            <span class="poster-image">
              <img src="assets/perla-properties/success-leadership-preview.webp" srcset="assets/perla-properties/success-leadership-preview.webp 400w, assets/perla-properties/success-leadership-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/success-leadership.webp" width="1080" height="1440" alt="A portrait in front of a dark wall with the illuminated PERLA emblem." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Success Demands More — Leadership</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View A Location With Purpose">
            <span class="poster-image">
              <img src="assets/perla-properties/location-with-purpose-preview.webp" srcset="assets/perla-properties/location-with-purpose-preview.webp 400w, assets/perla-properties/location-with-purpose-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/location-with-purpose.webp" width="1080" height="1440" alt="A dark map with Sharqia and Hadayek October marked, above a gold seal." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">A Location With Purpose</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Quality Without Compromise">
            <span class="poster-image">
              <img src="assets/perla-properties/quality-without-compromise-preview.webp" srcset="assets/perla-properties/quality-without-compromise-preview.webp 400w, assets/perla-properties/quality-without-compromise-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/quality-without-compromise.webp" width="1080" height="1440" alt="A black-and-white façade cuts diagonally across a flat gold field." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Quality Without Compromise</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View More Than a Place">
            <span class="poster-image">
              <img src="assets/perla-properties/more-than-a-place-preview.webp" srcset="assets/perla-properties/more-than-a-place-preview.webp 400w, assets/perla-properties/more-than-a-place-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/more-than-a-place.webp" width="1080" height="1440" alt="A softly backlit silhouette raises her hand against warm gold light." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">More Than a Place</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Design With Intent">
            <span class="poster-image">
              <img src="assets/perla-properties/design-with-intent-preview.webp" srcset="assets/perla-properties/design-with-intent-preview.webp 400w, assets/perla-properties/design-with-intent-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/design-with-intent.webp" width="1080" height="1440" alt="A suited figure seen through a sunlit arch next to vertical gold typography." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Design With Intent</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Quality Has Its Standards">
            <span class="poster-image">
              <img src="assets/perla-properties/quality-has-standards-preview.webp" srcset="assets/perla-properties/quality-has-standards-preview.webp 400w, assets/perla-properties/quality-has-standards-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/quality-has-standards.webp" width="1080" height="1440" alt="A figure crosses a dark hall lined with illuminated gold fins." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Quality Has Its Standards</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
          <button type="button" class="poster" aria-label="View Experience Beyond One Perspective">
            <span class="poster-image">
              <img src="assets/perla-properties/experience-beyond-perspective-preview.webp" srcset="assets/perla-properties/experience-beyond-perspective-preview.webp 400w, assets/perla-properties/experience-beyond-perspective-wide.webp 720w"
                sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
                data-full="assets/perla-properties/experience-beyond-perspective.webp" width="1080" height="1440" alt="Blurred figures cross the top and bottom of a black composition with gold typography." decoding="async" loading="lazy">
            </span>
            <span class="poster-caption"><span class="poster-title">Experience Beyond One Perspective</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
          </button>
        </div>
      </section>
      <section class="collection" id="gardens-gallery" role="tabpanel" aria-labelledby="gardens-tab" tabindex="0" hidden>
        <p class="empty-gallery">Artwork coming soon.</p>
      </section>
    </section>

    <section class="project" id="forsan-gallery" role="tabpanel" aria-labelledby="forsan-tab" tabindex="0" hidden>
      <div class="project-header">
        <h1>AL FORSAN</h1>
        <span class="project-meta">9 artworks</span>
      </div>
      <div class="image-grid">
        <button type="button" class="poster" aria-label="View New Form, Same Force">
          <span class="poster-image">
            <img src="assets/al-forsan/new-form-preview.webp" srcset="assets/al-forsan/new-form-preview.webp 400w, assets/al-forsan/new-form-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/new-form.webp" width="1080" height="1440" alt="Red-lit close-up of a horse’s eye with the Forsan Developments wordmark" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">New Form, Same Force</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Zero-Risk Execution">
          <span class="poster-image">
            <img src="assets/al-forsan/zero-risk-preview.webp" srcset="assets/al-forsan/zero-risk-preview.webp 400w, assets/al-forsan/zero-risk-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/zero-risk.webp" width="1080" height="1440" alt="A hand holding a horse-head cane beside a red hard hat" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Zero-Risk Execution</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Field Mastery">
          <span class="poster-image">
            <img src="assets/al-forsan/field-mastery-preview.webp" srcset="assets/al-forsan/field-mastery-preview.webp 400w, assets/al-forsan/field-mastery-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/field-mastery.webp" width="1080" height="1440" alt="People casting long shadows across a grid above a red block of typography" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Field Mastery</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Endless Connection">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-architecture-preview.webp" srcset="assets/al-forsan/laguna-architecture-preview.webp 400w, assets/al-forsan/laguna-architecture-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-architecture.webp" width="1080" height="1440" alt="Lit windows in a curved Laguna Mall facade with red light trails" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Endless Connection</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Sheikh Zaid">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-cafe-preview.webp" srcset="assets/al-forsan/laguna-cafe-preview.webp 400w, assets/al-forsan/laguna-cafe-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-cafe.webp" width="1080" height="1440" alt="A person holding a cup in a café framed by soft red reflections" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Sheikh Zaid</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Laguna Mall, Flow and Discovery">
          <span class="poster-image">
            <img src="assets/al-forsan/laguna-stairs-preview.webp" srcset="assets/al-forsan/laguna-stairs-preview.webp 400w, assets/al-forsan/laguna-stairs-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/laguna-stairs.webp" width="1080" height="1440" alt="Blurred shoppers in motion on a vivid red staircase" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Flow and Discovery</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>

              data-full="assets/al-forsan/laguna-lifestyle.webp" width="1080" height="1440" alt="A woman in red sitting in a shopping cart in a dark car park" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Laguna Mall — Service Meets Lifestyle</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>
        <button type="button" class="poster" aria-label="View Plot 14, The Arena of Dominance">
          <span class="poster-image">
            <img src="assets/al-forsan/plot-14-arena-preview.webp" srcset="assets/al-forsan/plot-14-arena-preview.webp 400w, assets/al-forsan/plot-14-arena-wide.webp 720w"
              sizes="(max-width: 640px) calc((100vw - 36px) / 2), 32vw"
              data-full="assets/al-forsan/plot-14-arena.webp" width="1080" height="1440" alt="A silhouetted figure on a stairway beside a sweeping red wall" decoding="async" loading="lazy">
          </span>
          <span class="poster-caption"><span class="poster-title">Plot 14 — The Arena of Dominance</span><span class="poster-arrow" aria-hidden="true">↗</span></span>
        </button>

          <span class="poster-image">
            <img src="assets/al-forsan/plot-14-courtyard-preview.webp" srcset="assets/al-forsan/plot-14-courtyard-preview.webp 400w, assets/al-forsan/plot-14-courtyard-wide.webp 720w"

          <span class="poster-caption"><span class="poster-title">Plot 14 — On the Axis</span><span class="poster-arrow" aria-hidden="true">↗</span></span>

  </main>

  <dialog class="viewer" aria-label="Project artwork">
    <div class="viewer-bar">
      <span class="viewer-position" aria-live="polite"></span>
      <div class="viewer-actions">
        <button type="button" data-step="-1" aria-label="Previous artwork">←</button>
        <button type="button" data-step="1" aria-label="Next artwork">→</button>
        <form method="dialog"><button type="submit" aria-label="Close artwork" autofocus>✕</button></form>
      </div>
    </div>
    <figure>
      <img class="viewer-image" alt="">
      <figcaption class="viewer-caption"></figcaption>
    </figure>
  </dialog>
</body>
</html>
