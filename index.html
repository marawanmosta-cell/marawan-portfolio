    <form class="editor-form">
      <h2 id="editor-title"></h2>
      <label class="editor-name">Name <input name="name" type="text" maxlength="90"></label>
      <label class="editor-file">
        <span class="editor-file-label">Images</span>
        <input name="files" type="file" accept="image/jpeg,image/png,image/webp">
        <small class="editor-preview-help"></small>
      </label>
      <label class="editor-alt">Image description <input name="alt" type="text" maxlength="180"></label>
      <p class="editor-message" role="status"></p>
      <div class="editor-dialog-actions">
        <button type="button" class="editor-cancel">Cancel</button>
        <button type="submit" class="editor-save">Save draft</button>
      </div>
    </form>
  </dialog>

        <button type="button" data-step="1" aria-label="Next artwork">→</button>
